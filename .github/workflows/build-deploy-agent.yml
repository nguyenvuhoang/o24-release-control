name: Build Deploy Agent

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build and push (vknighthub/o24-deploy-agent:<tag>)
        required: true
        default: "1.4.0"

permissions:
  contents: read

concurrency:
  group: build-deploy-agent-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/deploy-agent
          push: true
          tags: vknighthub/o24-deploy-agent:${{ inputs.tag }}
          # mode=max also caches intermediate layers from every build stage,
          # which is unnecessary here (two-stage Dockerfile, no shared base
          # across other images) and noticeably slows cache export — mode=min
          # (only the layers of the final image) is enough for this repo.
          cache-from: type=gha,scope=deploy-agent
          cache-to: type=gha,mode=min,scope=deploy-agent

      - name: Build summary
        run: |
          {
            echo "### Deploy Agent image published"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`vknighthub/o24-deploy-agent:${{ inputs.tag }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
