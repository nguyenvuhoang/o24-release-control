name: Reconcile Release Snapshots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-release-snapshots
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile pending snapshots
        env:
          RECONCILE_URL: https://release-control.vknight.io.vn/api/cron/reconcile-snapshots
          RECONCILE_SECRET: ${{ secrets.RECONCILE_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --max-time 60 \
            -H "Authorization: Bearer ${RECONCILE_SECRET}" \
            "${RECONCILE_URL}"
